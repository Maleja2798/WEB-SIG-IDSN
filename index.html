<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Visor SIG - Autorizaciones Sanitarias IDSN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      background-color: black;
      font-family: "Arial Narrow", sans-serif;
    }
    .leaflet-popup-content {
      font-size: 13px;
      color: white;
    }
    .leaflet-control-zoom a,
    .leaflet-control-geocoder a {
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      font-weight: bold;
      border-radius: 5px;
    }
    .leaflet-bar a {
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // Inicializar el mapa centrado en Nariño
  const map = L.map('map').setView([1.214, -77.281], 9);

  // Mapa base estilo satelital Google
  const satelite = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
    attribution: '&copy; Google Maps',
    maxZoom: 20
  }).addTo(map);

  // Escala
  L.control.scale({ position: 'bottomright' }).addTo(map);

  // Geocoder (búsqueda)
  L.Control.geocoder({
    defaultMarkGeocode: true,
    placeholder: "Buscar municipio...",
    showResultIcons: false
  }).addTo(map);

  // Aquí se agregarán las capas AS2023 y AS2024 más adelante
</script>

</body>
</html>
