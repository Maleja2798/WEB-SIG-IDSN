norteControl.addTo(map);

    map.createPane("marcadores");
    map.getPane("marcadores").style.zIndex = 650;

    const baseMaps = {
      "Mapa Estándar": L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map),
      "Satélite (ESRI)": L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
        attribution: "Tiles &copy; Esri",
      }),
      "Topográfico": L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenTopoMap contributors",
      }),
    };
    L.control.layers(baseMaps, null, { position: "topright" }).addTo(map);
    L.control.zoom({ position: "topright" }).addTo(map);
    L.control.scale({ position: "bottomright", metric: true, imperial: false }).addTo(map);
    L.Control.geocoder({ defaultMarkGeocode: true }).on("markgeocode", e => {
      map.setView(e.geocode.center, 12);
    }).addTo(map);
    // evitar error si no existe aún el icono
    if (document.querySelector(".leaflet-control-geocoder-icon")) {
      document.querySelector(".leaflet-control-geocoder-icon").title = "Buscar";
    }
    new L.Control.MiniMap(
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"),
      { toggleDisplay: true, position: "bottomleft" }
    ).addTo(map);

    let geojsonLayer;

    // ---------- Variables de gestión ----------
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSKeiBBKiYlwHasbQMehxNAL7d4gbjb57bHVnVc4Ui5NWr5XetoTGtMGdd4KRoMWAkXDyuCcRbx0oj8/pub?output=csv"; // <--- ruta local que indicaste
    const datosPorAnio = {};        // { "2023": [row, ...], "2024": [...] }
    const markersPorAnio = {};      // { "2023": L.layerGroup(), ... }
    const municipiosPorAnio = {};   // { "2023": Set(...), ... }
    const fuentesPorAnio = {};      // { "2023": Set(...), ... }
    let anioActivo = null;

    // ---------- Leer CSV único y agrupar por AÑO ----------
    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: results => {
        const rows = results.data;
        rows.forEach(r => {
          // Normalizar clave año desde columna 'AÑO' (puede venir como 'AÑO' o 'AÑO ' según CSV)
          const keyAnio = (r["AÑO"] || r["AÑO "] || r["Año"] || r["YEAR"] || "").toString().trim();
          if (!keyAnio) return;
          const anio = keyAnio;
          if (!datosPorAnio[anio]) {
            datosPorAnio[anio] = [];
            municipiosPorAnio[anio] = new Set();
            fuentesPorAnio[anio] = new Set();
          }
          datosPorAnio[anio].push(r);
          if (r["MUNICIPIO"]) municipiosPorAnio[anio].add(r["MUNICIPIO"].trim());
          if (r["FUENTE"]) fuentesPorAnio[anio].add(r["FUENTE"].trim());
        });

        crearBotonesAnios();
        crearCapasPorAnio();
        // activar primer año disponible automáticamente
        const primeros = Object.keys(datosPorAnio).sort();
        if (primeros.length) activarAnio(primeros[0]);
      },
      error: err => {
        console.error("Error cargando CSV:", err);
        alert("No se pudo cargar el CSV. Verifica la ruta/permiso del archivo.");
      }
    });

    // ---------- Crear botones dinámicos por año ----------
    function crearBotonesAnios() {
      const cont = document.getElementById("botones-anio");
      cont.innerHTML = "";
      const anos = Object.keys(datosPorAnio).sort();
      anos.forEach(a => {
        const btn = document.createElement("div");
        btn.className = "boton-anio";
        btn.textContent = a;
        btn.onclick = () => activarAnio(a);
        btn.id = `boton-anio-${a}`;
        cont.appendChild(btn);
      });
    }

function obtenerDatosDashboard(anio, municipio = "TODOS") {

    let datos = datosPorAnio[anio] || [];

    if (municipio !== "TODOS") {

        datos = datos.filter(r =>
            (r["MUNICIPIO"] || "").trim() === municipio
        );

    }

    return {

        totalFuentes: datos.length,

        totalMunicipios: new Set(
            datos.map(r => r["MUNICIPIO"])
        ).size,

        datos: datos

    };

}

    // ---------- Crear capas (markers) por año (mantiene popups parecidos) ----------
    function crearCapasPorAnio() {
      Object.keys(datosPorAnio).forEach(anio => {
        const layer = L.layerGroup();
        const grouped = {}; // agrupar por vereda+coord para mostrar una sola marca por vereda
        datosPorAnio[anio].forEach(row => {
          const vereda = (row["CORREGIMIENTO O VEREDA"] || row["CORREGIMIENTO O VEREDA "] || row["CORREGIMIENTO O VEREDA"]).trim();
          const lat = parseFloat((row["LATITUD DECIMAL"] || row["LATITUD DECIMAL "] || "").toString().replace(",", "."));
          const lon = parseFloat((row["LONGITUD DECIMAL"] || row["LONGITUD DECIMAL "] || "").toString().replace(",", "."));
          if (!vereda || isNaN(lat) || isNaN(lon)) return;
          const key = vereda + "|" + lat + "|" + lon;
          if (!grouped[key]) grouped[key] = { vereda, lat, lon, filas: [] };
          grouped[key].filas.push(row);
        });

        Object.values(grouped).forEach(g => {
          // Formato del contenido del primer cuadro (como pediste):
          // Municipio: (negrita) etc. Las fuentes aparecen como link (azul) que llama a showFuenteEncoded.
          const municipio = (g.filas[0]["MUNICIPIO"] || "").toString().trim() || "Desconocido";

          const contentVereda = `
            <div style="font-family: Arial Narrow, sans-serif; font-size: 13px; color: black;">
              <div><b>Municipio:</b> ${municipio}</div>
              <div style="margin-top:6px;"><b>Vereda:</b> ${g.vereda}</div>
              <div style="margin-top:6px;"><b>La Fuente:</b><br>
                ${g.filas.map(f => {
                  const nombreFuente = (f["FUENTE"] || "").toString().trim();
                  const jsonEnc = encodeURIComponent(JSON.stringify({
                    fuente: nombreFuente,
                    no_aut: f["NO. AUTORIZACIÓN"] || f["NO. AUTORIZACION"] || f["NO. AUTORIZACIÓN "] || "",
                    fecha: f["FECHA AUTORIZACIÓN"] || f["FECHA AUTORIZACION"] || f["FECHA AUTORIZACIÓN "] || "",
                    anexo: f["ANEXO"] || f["ANEXO "] || "",
                    autorizacion: f["AUTORIZACION SANITARIA"] || f["AUTORIZACION SANITARIA "] || ""
                  }));
                  return `<a href="#" onclick="showFuenteEncoded(${g.lat}, ${g.lon}, '${jsonEnc}'); return false;" style="color: #00BFFF; display:block; margin-top: 2px;">${nombreFuente}</a>`;
                }).join("")}
              </div>
            </div>
          `;

          //==================================================
// Estado temporal
//==================================================

let estado = "tramite";

// Más adelante el color vendrá del Excel

const icono = crearMarcador(estado);

const marker = L.marker(
    [g.lat, g.lon],
    {
        icon: icono,
        pane:"marcadores"
    }
).bindPopup(contentVereda);
          layer.addLayer(marker);
        });

        markersPorAnio[anio] = layer;
      });
    }

    // ---------- showFuenteEncoded: abre cuadro 2 con info detallada ----------
    function showFuenteEncoded(lat, lon, jsonEnc) {
      try {
        const f = JSON.parse(decodeURIComponent(jsonEnc));
        // Cuadro 2: nombre de la quebrada (FUENTE) EN MAYÚSCULAS, No. autorización, Fecha, Anexo, Autorización Sanitaria (VER)
        const content = `
          <div style="font-family:'Arial Narrow', sans-serif; font-size:13px; color: black;">
            <div style="font-weight:bold; text-transform: uppercase; margin-bottom:6px;">${f.fuente || ''}</div>
            <div><b>No. autorización:</b><br>${f.no_aut || ''}</div>
            <div style="margin-top:6px;"><b>Fecha autorización:</b><br>${f.fecha || ''}</div>
            <div style="margin-top:6px;"><b>Anexo:</b><br><a href="${f.anexo || '#'}" target="_blank" style="color:#00BFFF;">VER</a></div>
            <div style="margin-top:6px;"><b>Autorización sanitaria:</b><br><a href="${f.autorizacion || f.anexo || '#'}" target="_blank" style="color:#00BFFF;">VER</a></div>
          </div>
        `;
        L.popup({ maxWidth: 350 }).setLatLng([lat, lon]).setContent(content).openOn(map);
      } catch (e) {
        console.error("Error al mostrar fuente:", e);
      }
    }
    // Exponer para onclick en HTML generado
    window.showFuenteEncoded = showFuenteEncoded;

    // ---------- Activar / cambiar año (muestra capa, actualiza UI de búsqueda) ----------
    function activarAnio(anio) {
      // remover capa anterior
      if (anioActivo && markersPorAnio[anioActivo] && map.hasLayer(markersPorAnio[anioActivo])) {
        map.removeLayer(markersPorAnio[anioActivo]);
      }
      anioActivo = anio;
      const capa = markersPorAnio[anio];
      if (capa) map.addLayer(capa);

      // marcar botón activo visualmente
      document.querySelectorAll('.boton-anio').forEach(b => b.classList.remove('activo'));
      const boton = document.getElementById(`boton-anio-${anio}`);
      if (boton) boton.classList.add('activo');

      // actualizar nota año activo
      document.getElementById('nota-ano').textContent = `Año activo: ${anio}`;

      // centrar mapa en la primera marca de ese año (si existe)
      const firstLayer = capa && capa.getLayers && capa.getLayers()[0];
      if (firstLayer) {
        const latlng = firstLayer.getLatLng();
        map.setView(latlng, 10);
      }

      // resetear buscador
      document.getElementById('input-buscar').value = "";
    }

function iniciarBuscadorMunicipios(){

const input=document.getElementById("buscarMunicipio");

const lista=document.getElementById("listaMunicipios");

if(!input || !lista) return;

input.addEventListener("input",function(){

const texto=this.value.toLowerCase().trim();

lista.innerHTML="";

if(texto===""){

lista.style.display="none";

return;

}

const municipios=[...municipiosPorAnio[anioActivo]].sort();

const encontrados=municipios.filter(m=>m.toLowerCase().includes(texto));

encontrados.forEach(m=>{

const item=document.createElement("div");

item.className="item-municipio";

item.textContent=m;

item.onclick=function(){

input.value=m;

lista.style.display="none";

};

lista.appendChild(item);

});

lista.style.display=encontrados.length?"block":"none";

});

document.addEventListener("click",function(e){

if(!e.target.closest(".dashboard-search")){

lista.style.display="none";

}

});

}
    // ---------- Cargar GeoJSON (sin cambiar) ----------
    fetch("https://raw.githubusercontent.com/Maleja2798/WEB-SIG-IDSN/main/Municipios_Nari%C3%B1o.geojson")
      .then(response => response.json())
      .then(data => {
        geojsonLayer = L.geoJson(data, {
          style: function(feature) {
            // color aleatorio en base al nombre (mantener tu lógica)
            const nombre = feature.properties.NOMBRE_ENT || "";
            let hash = 0; for (let i=0;i<nombre.length;i++) hash = nombre.charCodeAt(i)+((hash<<5)-hash);
            const colores = ["#63C5DA","#52B2BF","#82EEFD","#0492C2","#00BFFF","#1877F2","#B2FFFF","#AFEEEE","#ADD8E6","#7DF9FF","#89CFF0","#A1CAF1","#4682B4","#73C2FB","#6495ED","#AFDBF5","#15F4EE"];
            const color = colores[Math.abs(hash) % colores.length];
            return { color: "white", weight: 2, fillOpacity: 0.6, fillColor: color };
          },
          onEachFeature: function(feature, layer) {
            const nombreMunicipio = feature.properties.NOMBRE_ENT;
            const nombreFormateado = nombreMunicipio ? nombreMunicipio.charAt(0).toUpperCase() + nombreMunicipio.slice(1).toLowerCase() : 'Desconocido';
            layer.bindPopup(`<b>MUNICIPIO</b><br>${nombreFormateado}`);
            layer.on({ mouseover: function(e){ e.target.setStyle({ weight:3, color:'#FFFF00', fillOpacity:0.7}); e.target.bringToFront(); }, mouseout: function(e){ geojsonLayer.resetStyle(e.target); }, click: function(e){ layer.openPopup(); map.fitBounds(layer.getBounds()); } });
          }
        }).addTo(map);
        geojsonLayer.bringToBack();
      })
      .catch(err => console.error("Error cargando GeoJSON:", err));
