<script>
// ...todo el script como ya lo tienes, hasta esta parte:

const markers = {
  2023: L.layerGroup(),
  2024: L.layerGroup(),
  2025: L.layerGroup()
};

window.popupData = []; // <--- Esta línea DEBE estar aquí, al inicio del script principal

function cargarCsv(year, url) {
  Papa.parse(url, {
    download: true,
    header: true,
    skipEmptyLines: true,
    delimiter: ",",
    complete: function (results) {
      const data = results.data;
      const agrupado = {};

      data.forEach(row => {
        const lat = parseFloat(row["LATITUD DECIMAL"].replace(",", "."));
        const lng = parseFloat(row["LONGITUD DECIMAL"].replace(",", "."));
        const key = `${lat}_${lng}`;

        if (!isNaN(lat) && !isNaN(lng)) {
          if (!agrupado[key]) {
            agrupado[key] = {
              municipio: row["MUNICIPIO"],
              vereda: row["CORREGIMIENTO O VEREDA"],
              lat,
              lng,
              fuentes: []
            };
          }

          const fuentes = row["FUENTE"].split(';');
          const autorizaciones = row["NO. AUTORIZACION"].split(';');
          const fechas = row["FECHA AUTORIZACION"].split(';');
          const anexos = row["ANEXO"].split(';');

          fuentes.forEach((fuente, idx) => {
            agrupado[key].fuentes.push({
              fuente: fuente.trim(),
              no_aut: autorizaciones[idx]?.trim() || '',
              fecha: fechas[idx]?.trim() || '',
              anexo: anexos[idx]?.trim() || ''
            });
          });
        }
      });

      Object.values(agrupado).forEach((entry, index) => {
        window.popupData[index] = entry;
        const popupContent = `
          <div id="popup-main-${index}" style="font-family: 'Arial Narrow', sans-serif; font-size: 13px;">
            <div><b>Municipio:</b> ${entry.municipio}</div>
            <div><b>Vereda:</b> ${entry.vereda}</div>
            <div style="margin-top: 6px;"><b>Fuentes:</b><br>
              ${entry.fuentes.map((f, i) => `
                <a href="#" onclick="showDetalle(${index}, ${i}); return false;" style="color: #00BFFF; display:block; margin-top: 2px;">${f.fuente}</a>
              `).join("")}
            </div>
          </div>
          <div id="popup-detalle-${index}" style="display: none; font-family: 'Arial Narrow', sans-serif; font-size: 13px;"></div>
        `;

        let iconoUsado = icono2023;
        if (year === 2024) iconoUsado = icono2024;
        else if (year === 2025) iconoUsado = icono2025;

        const marker = L.marker([entry.lat, entry.lng], {
          pane: "marcadores",
          icon: iconoUsado
        }).bindPopup(popupContent);

        if (markers[year]) {
          markers[year].addLayer(marker);
        }
      });
    },
    error: function (err) {
      console.error("Error al cargar el CSV de " + year, err);
    }
  });
}

function showDetalle(markerIndex, fuenteIndex) {
  const markerData = window.popupData[markerIndex];
  const fuente = markerData.fuentes[fuenteIndex];

  const mainDiv = document.getElementById(`popup-main-${markerIndex}`);
  const detalleDiv = document.getElementById(`popup-detalle-${markerIndex}`);

  if (mainDiv && detalleDiv) {
    mainDiv.style.display = "none";
    detalleDiv.style.display = "block";
    detalleDiv.innerHTML = `
      <div style="font-weight: bold; text-transform: uppercase; margin-bottom: 4px;">${fuente.fuente}</div>
      <div><b>Número de autorización:</b> ${fuente.no_aut}</div>
      <div><b>Fecha de autorización:</b> ${fuente.fecha}</div>
      <div><b>Anexo:</b> <a href="${fuente.anexo}" target="_blank" style="color: #00BFFF;">Ver</a></div>
    `;
  }
}
</script>
