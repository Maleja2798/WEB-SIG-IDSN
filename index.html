<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SIG – Autorizaciones Sanitarias</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    #year-buttons {
        padding: 10px;
        background: #003366;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .year-btn {
        background: white;
        border: none;
        padding: 8px 15px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
    }

    .year-btn:hover {
        background: #4da3ff;
        color: white;
    }

    .year-btn.active {
        background: #2288ff;
        color: white;
    }

    #map {
        width: 100%;
        height: calc(100vh - 70px);
    }
</style>
</head>

<body>

<!-- BOTONES DINÁMICOS DE AÑOS -->
<div id="year-buttons"></div>

<!-- MAPA -->
<div id="map"></div>

<script>
// -------------------------------
// CONFIGURACIÓN
// -------------------------------
const CSV_URL =
"https://api.allorigins.win/get?url=" +
encodeURIComponent("https://docs.google.com/spreadsheets/d/e/2PACX-1vSKeiBBKiYlwHasbQMehxNAL7d4gbjb57bHVnVc4Ui5NWr5XetoTGtMGdd4KRoMWAkXDyuCcRbx0oj8/pub?output=csv");

// MAPA
let map = L.map('map').setView([1.553, -75.564], 8);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18
}).addTo(map);

let markerLayer = L.layerGroup().addTo(map);

// -------------------------------
// 1. DESCARGAR CSV
// -------------------------------
async function loadCSV() {
    const response = await fetch(CSV_URL);
    const data = await response.json();  
    const csv = data.contents;          

    return parseCSV(csv);
}

// -------------------------------
// 2. PARSEAR CSV
// -------------------------------
function parseCSV(text) {
    const lines = text.split("\n").map(l => l.trim());
    const headers = lines[0].split(",");

    return lines.slice(1).map(row => {
        const cols = row.split(",");
        let obj = {};
        headers.forEach((h, i) => {
            obj[h.trim()] = cols[i] ? cols[i].trim() : "";
        });
        return obj;
    });
}

// -------------------------------
// 3. CREAR BOTONES DE AÑOS
// -------------------------------
function createYearButtons(data) {
    const years = [...new Set(data.map(d => d.AÑO))].sort();

    const container = document.getElementById("year-buttons");
    container.innerHTML = "";

    years.forEach(year => {
        let btn = document.createElement("button");
        btn.innerText = year;
        btn.classList.add("year-btn");
        btn.onclick = () => {
            document.querySelectorAll(".year-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            loadYearData(year, data);
        };
        container.appendChild(btn);
    });
}

// -------------------------------
// 4. CARGAR DATOS DE UN AÑO
// -------------------------------
function loadYearData(year, data) {
    markerLayer.clearLayers();

    const filtered = data.filter(d => d.AÑO == year);

    filtered.forEach(item => {
        if (!item.Latitud || !item.Longitud) return;

        let marker = L.marker([parseFloat(item.Latitud), parseFloat(item.Longitud)]);

        let html = `
            <b>${item.Municipio}</b><br>
            <b>Prestador:</b> ${item.Prestador}<br>
            <b>Dirección:</b> ${item.Dirección}<br>
            <b>NIT:</b> ${item.NIT}<br>
            <b>Estado:</b> ${item.Estado}<br>
            <b>Servicio:</b> ${item.Servicio}<br>
            <b>Año:</b> ${item.AÑO}
        `;

        marker.bindPopup(html);
        markerLayer.addLayer(marker);
    });

    map.setView([1.553, -75.564], 8);
}

// -------------------------------
// INICIAR SISTEMA
// -------------------------------
loadCSV().then(data => {
    createYearButtons(data);
});
</script>
</body>
</html>
