<!DOCTYPE html>
<html>
<head>
  <title>Visor Autorizaciones Sanitarias Nariño</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <script src="https://unpkg.com/leaflet-search@3.0.2/dist/leaflet-search.src.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-search@3.0.2/dist/leaflet-search.src.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Arial Narrow', sans-serif;
    }
    #map {
      height: 100vh;
      width: 100%;
      background-color: black;
    }
    .leaflet-control-layers {
      font-family: 'Arial Narrow', sans-serif;
    }
    .leaflet-popup-content {
      font-family: 'Arial Narrow', sans-serif;
      font-size: 13px;
    }
  </style>

  <!-- PapaParse para leer CSV -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    // Función para cargar datos CSV agrupados por municipio
    function cargarCSV(url, capaGrupo, color) {
      Papa.parse(url, {
        download: true,
        header: true,
        complete: function(results) {
          const datos = results.data;
          const municipios = {};

          datos.forEach(row => {
            const municipio = row["Nombre del Municipio"];
            const vereda = row["Nombre del Corregimiento o Vereda"];
            const fuente = row["Nombre de la Fuente"];
            const lat = parseFloat(row["Latitud"]);
            const lon = parseFloat(row["Longitud"]);

            if (!isNaN(lat) && !isNaN(lon)) {
              if (!municipios[municipio]) {
                municipios[municipio] = {
                  veredas: new Set(),
                  fuentes: new Set(),
                  lat: lat,
                  lon: lon
                };
              }
              municipios[municipio].veredas.add(vereda);
              municipios[municipio].fuentes.add(fuente);
            }
          });

          Object.entries(municipios).forEach(([muni, data]) => {
            const marcador = L.marker([data.lat, data.lon], {
              icon: L.divIcon({
                className: 'custom-div-icon',
                html: `<div style="background:${color};border-radius:10px;padding:2px 5px;font-family:'Arial Narrow';color:white">➤</div>`,
                iconSize: [20, 20],
                iconAnchor: [10, 10]
              })
            });

            const veredas = Array.from(data.veredas).join(", ");
            const fuentes = Array.from(data.fuentes).join(", ");

            marcador.bindPopup(`
              <div style="font-family:'Arial Narrow'; font-size:13px;">
                <b>Municipio:</b> ${muni}<br>
                <b>Veredas/Corregimientos:</b> ${veredas}<br>
                <b>Fuentes:</b> ${fuentes}
              </div>
            `);

            marcador.addTo(capaGrupo);
          });
        }
      });
    }
  </script>
</head>

<body>
  <div id="map"></div>

  <script>
    var map = L.map('map').setView([1.5, -77.3], 8);

    var baseMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles © Esri'
    });

    var terrain = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenTopoMap contributors'
    });

    var baseMaps = {
      "Mapa Base": baseMap,
      "Satélite": satellite,
      "Terreno": terrain
    };

    // Capas para datos CSV 2023 y 2024
    var capa2023 = L.layerGroup().addTo(map);
    var capa2024 = L.layerGroup().addTo(map);

    cargarCSV(
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEIfxPwnfsK29s70MMP_eimRMxEIeTyWye0GIsUAslrRrWalcULyXwWlSiyZenbJ_r4-ww-vBHBnun/pub?gid=0&single=true&output=csv",
      capa2023,
      "#0078D4"
    );

    cargarCSV(
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vR9MXHFzd2BkQkYDlCp3TS0vLQr6JCzV-prDxyNErrCiXHAnHnKjH95Z1es_jhYbRwnI2C5mZgW0Ccr/pub?gid=0&single=true&output=csv",
      capa2024,
      "#FF5733"
    );

    // Control de capas (base y CSVs)
    L.control.layers(baseMaps, {
      "Autorizaciones 2023": capa2023,
      "Autorizaciones 2024": capa2024
    }, {
      collapsed: false,
      position: 'topright'
    }).addTo(map);

    // Buscador con fondo negro y texto "Buscar"
    var geocoder = L.Control.geocoder({
      defaultMarkGeocode: false
    }).on('markgeocode', function(e) {
      map.setView(e.geocode.center, 12);
    }).addTo(map);

    // Escala
    L.control.scale().addTo(map);

    // Norte
    var north = L.control({ position: "topright" });
    north.onAdd = function(map) {
      var div = L.DomUtil.create("div", "info legend");
      div.innerHTML = '<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/dc/Compass_rose_pale.svg/200px-Compass_rose_pale.svg.png" style="width:40px;">';
      return div;
    };
    north.addTo(map);
  </script>
</body>
</html>
