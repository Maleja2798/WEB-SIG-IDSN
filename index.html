<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa de Autorizaciones Sanitarias de Agua en Nariño</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet-minimap/dist/Control.MiniMap.min.css" />
  <script src="https://unpkg.com/leaflet-minimap/dist/Control.MiniMap.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Arial Narrow", sans-serif;
      background-color: black;
    }
    h1 {
      text-align: center;
      background-color: rgba(0, 0, 0, 0.4);
      padding: 7px;
      font-size: 24px;
      font-weight: bold;
      color: white;
    }
    #map {
      height: 90vh;
      width: 100%;
    }
    #botones-anio {
      position: absolute;
      bottom: 40px;
      right: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .boton-anio {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid white;
      padding: 6px 12px;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    .boton-anio:hover {
      background: rgba(255,255,255,0.15);
    }
  </style>
</head>

<body>

<h1>MAPA DE AUTORIZACIONES SANITARIAS DE AGUA EN NARIÑO</h1>
<div id="map"></div>
<div id="botones-anio"></div>

<script>
/*-------------------------------------------------------
  MAPA BASE
--------------------------------------------------------*/
const map = L.map("map", { zoomControl: false }).setView([1.289, -77.29], 8);

L.control.zoom({ position: "topright" }).addTo(map);
L.control.scale({ position: "bottomright" }).addTo(map);

L.control.layers(
  {
    "Estándar": L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map),
    "Satélite": L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}")
  },
  null,
  { position: "topright" }
).addTo(map);

// ICONOS POR AÑO
const iconos = {};
function iconoPara(year){
  if(!iconos[year]) {
    const idx = Object.keys(iconos).length + 1;
    iconos[year] = L.icon({
      iconUrl: `MARCADOR${idx}.png`,
      iconSize: [32, 32],
      iconAnchor: [16, 32],
      popupAnchor: [0, -32]
    });
  }
  return iconos[year];
}

// CSV ÚNICO
const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSKeiBBKiYlwHasbQMehxNAL7d4gbjb57bHVnVc4Ui5NWr5XetoTGtMGdd4KRoMWAkXDyuCcRbx0oj8/pub?output=csv";

let datosPorAnio = {};
let markersPorAnio = {};
let listaMunicipios = {};
let listaFuentes = {};

let capaActiva = null;

/*-------------------------------------------------------
  CARGAR CSV ÚNICO
--------------------------------------------------------*/
Papa.parse(urlCSV, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: (r) => procesarCSV(r.data)
});

function procesarCSV(rows){
  rows.forEach(row => {
    const year = parseInt(row["AÑO"]);
    if(isNaN(year)) return;

    if(!datosPorAnio[year]) {
      datosPorAnio[year] = [];
      listaMunicipios[year] = new Set();
      listaFuentes[year] = new Set();
    }

    datosPorAnio[year].push(row);
    listaMunicipios[year].add(row["MUNICIPIO"]);
    listaFuentes[year].add(row["FUENTE"]);
  });

  crearBotonesAnios();
  crearCapasAnios();
}

/*-------------------------------------------------------
  BOTONES AUTOMÁTICOS
--------------------------------------------------------*/
function crearBotonesAnios(){
  const cont = document.getElementById("botones-anio");
  cont.innerHTML = "";

  Object.keys(datosPorAnio).sort().forEach(year => {
    const btn = document.createElement("div");
    btn.className = "boton-anio";
    btn.textContent = year;
    btn.onclick = () => activarAnio(year);

    cont.appendChild(btn);
  });
}

/*-------------------------------------------------------
  CREAR CAPAS POR AÑO
--------------------------------------------------------*/
function crearCapasAnios(){
  Object.keys(datosPorAnio).forEach(year => {
    const capa = L.layerGroup();

    datosPorAnio[year].forEach(r => {
      const lat = parseFloat((r["LATITUD DECIMAL"] || "").replace(",", "."));
      const lon = parseFloat((r["LONGITUD DECIMAL"] || "").replace(",", "."));
      if(isNaN(lat) || isNaN(lon)) return;

      const popup = `
        <b>MUNICIPIO:</b> ${r["MUNICIPIO"]}<br>
        <b>VEREDA:</b> ${r["CORREGIMIENTO O VEREDA"]}<br><br>
        <b>FUENTE:</b> ${r["FUENTE"]}<br>
        <b>No. AUTORIZACIÓN:</b> ${r["NO. AUTORIZACIÓN"]}<br>
        <b>FECHA:</b> ${r["FECHA AUTORIZACIÓN"]}<br>
        <b>ANEXO:</b> <a href="${r["ANEXO"]}" target="_blank">Ver</a>
      `;

      L.marker([lat, lon], { icon: iconoPara(year) }).bindPopup(popup).addTo(capa);
    });

    markersPorAnio[year] = capa;
  });
}

/*-------------------------------------------------------
  ACTIVAR AÑO
--------------------------------------------------------*/
function activarAnio(year){
  if(capaActiva) map.removeLayer(capaActiva);
  capaActiva = markersPorAnio[year];
  map.addLayer(capaActiva);

  alert(`Año ${year} activado. Búsqueda por municipio y fuente funcionando para este año.`);
}

</script>
</body>
</html>
