L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

function getRandomBlueColor() {
let blueValue = Math.floor(Math.random() * 100) + 150;
let greenValue = Math.floor(Math.random() * 100) + 100;
return `rgb(0, ${greenValue}, ${blueValue})`;
}
fetch('https://raw.githubusercontent.com/Maleja2798/WEB-SIG-IDSN/main/Munip_Nari%C3%B1o.geojson')
.then(response => response.json())
.then(data => {
var geojsonLayer = L.geoJson(data, {
style: function() {
return {
color: 'white',
weight: 1,
fillColor: getRandomBlueColor(),
fillOpacity: 0.7
};
},
onEachFeature: function(feature, layer) {
var nombreMunicipio = feature.properties.NOMBRE_ENT || "Sin nombre";
layer.bindPopup("<b>MUNICIPIO:</b> <span style='font-family: Arial Narrow;'>" + nombreMunicipio + "</span>");
layer.on('click', function() {
geojsonLayer.resetStyle();
layer.setStyle({
color: 'yellow',
weight: 3,
fillColor: 'orange',
fillOpacity: 0.7
});
map.fitBounds(layer.getBounds());
});
}
}).addTo(map);
})
.catch(error => console.error('Error cargando el GeoJSON:', error));

// Función para cargar los datos embebidos
function cargarDatosEmbebidos(csvText, capaGrupo, color) {
  Papa.parse(csvText, {
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      results.data.forEach(row => {
        const municipio = row["MUNICIPIO"];
        const vereda = row["CORREGIMIENTO O VEREDA"];
        const fuente = row["FUENTE"];
        const autorizacion = row["NO. AUTORIZACION"];
        const fecha = row["FECHA AUTORIZACION"];
        const lat = parseFloat(row["LATITUD DECIMAL"]);
        const lon = parseFloat(row["LONGITUD DECIMAL"]);
        const anexo = row["ANEXO"];

        if (!isNaN(lat) && !isNaN(lon)) {
          const marcador = L.marker([lat, lon], {
            icon: L.divIcon({
              className: 'custom-div-icon',
              html: `<div style="background:${color};border-radius:10px;padding:2px 5px;font-family:'Arial Narrow';color:white">\u2794</div>`,
              iconSize: [20, 20],
              iconAnchor: [10, 10]
            })
          });

          const popup = `
            <div style="font-family:'Arial Narrow'; font-size:13px;">
              <b>Municipio:</b> ${municipio}<br>
              <b>Corregimiento o Vereda:</b> ${vereda}<br>
              <b>Fuente:</b> ${fuente}<br>
              <b>N° Autorización:</b> ${autorizacion}<br>
              <b>Fecha Autorización:</b> ${fecha}<br>
              ${anexo ? `<b>Anexo:</b> <a href="${anexo}" target="_blank">Ver</a>` : ""}
            </div>`;
          marcador.bindPopup(popup);
          marcador.addTo(capaGrupo);
        }
      });
    }
  });
}

// Mostrar capas según el año
function mostrarCapa(anio) {
  map.removeLayer(capa2023);
  map.removeLayer(capa2024);
  if (anio === 2023) capa2023.addTo(map);
  else if (anio === 2024) capa2024.addTo(map);
}

// Ejecutar carga de datos embebidos
cargarDatosEmbebidos(datosCSV2023, capa2023, '#00bfff');
cargarDatosEmbebidos(datosCSV2024, capa2024, '#ff4500');
