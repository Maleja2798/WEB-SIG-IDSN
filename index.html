<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa de Autorizaciones Sanitarias de Agua en Nariño</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet-minimap/dist/Control.MiniMap.min.css" />
  <script src="https://unpkg.com/leaflet-minimap/dist/Control.MiniMap.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Arial Narrow", sans-serif;
      background-color: black;
      color: black;
    }
    h1 {
      text-align: center;
      background-color: rgba(0.1, 0.5, 0.5, 0.4);
      padding: 7px;
      font-size: 24px;
      font-weight: bold;
      color: white;
      backdrop-filter: blur(3px);
    }
    #map { height: 85vh; width: 100%; }

    /* 🔥 NUEVA UBICACIÓN DEL BUSCADOR */
    #controls-top {
      position: absolute;
      top: 15px;
      right: 10px;
      z-index: 1100;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }
    
    }
    #buscador input {
      background: transparent;
      border: none;
      outline: none;
      color: white;
      width: 160px;
      font-size: 13px;
    }

    #botones-anio {
      position: absolute;
      bottom: 40px;
      right: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .boton-anio {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid white;
      padding: 6px 12px;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      text-align:center;
      white-space: nowrap;
    }
    .boton-anio.activo {
      background: rgba(0, 180, 255, 0.15);
      border-color: #00BFFF;
    }
    .small-note {
      font-size: 12px;
      color: #ddd;
      margin-left:6px;
    }
  </style>
</head>
<body>
  <h1>MAPA DE AUTORIZACIONES SANITARIAS DE AGUA EN NARIÑO</h1>

  <div id="map"></div>

  <!-- 🔥 CONTROLES SUPERIORES: AHORA PRIMERO ARRIBA A LA DERECHA -->
  <div id="controls-top">
    <div id="buscador" title="Buscar por municipio o fuente en el año activo">
      <input id="input-buscar" placeholder="Buscar municipio o fuente..." />
      <button id="btn-buscar" style="background:transparent;border:1px solid #00BFFF;color:#00BFFF;padding:4px 8px;border-radius:4px;cursor:pointer;">Buscar</button>
      <button id="btn-reset" style="background:transparent;border:1px solid #fff;color:#fff;padding:4px 8px;border-radius:4px;cursor:pointer;">Reset</button>
    </div>
    <div class="small-note" id="nota-ano">Año activo: —</div>
  </div>

  <div id="botones-anio"></div>

<script>
/* ---------------------------------
   Mapa inicial
--------------------------------- */
const map = L.map("map", { zoomControl: false }).setView([1.289, -77.29], 8);

const norteControl = L.control({ position: 'topleft' });
norteControl.onAdd = function () {
  const div = L.DomUtil.create('div', 'info norte');
  div.innerHTML = `<img src="NORTE.png" style="width: 50px;">`;
  return div;
};
norteControl.addTo(map);

/* ICONOS */
const iconosPersonalizados = {
  "2023": L.icon({ iconUrl: 'MARCADOR1.png', iconSize: [32,32], iconAnchor:[16,32]}),
  "2024": L.icon({ iconUrl: 'MARCADOR2.png', iconSize: [32,32], iconAnchor:[16,32]}),
  "2025": L.icon({ iconUrl: 'MARCADOR3.png', iconSize: [32,32], iconAnchor:[16,32]})
};
const iconDefault = iconosPersonalizados["2023"];

/* ---------------------------------
   CAPAS BASE — deben quedar debajo del buscador
--------------------------------- */
const baseMaps = {
  "Mapa Estándar": L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map),
  "Satélite (ESRI)": L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"),
  "Topográfico": L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png"),
};

L.control.layers(baseMaps, null, { position: "topright" }).addTo(map);

/* ---------------------------------
   🔥 ELIMINADO: botón de geocoder (buscador blanco con lupa negra)
--------------------------------- */

/* ---------------------------------
   ZOOM → debajo del control de capas
--------------------------------- */
L.control.zoom({ position: "topright" }).addTo(map);

L.control.scale({ position: "bottomright" }).addTo(map);

/* minimapa */
new L.Control.MiniMap(
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"),
  { toggleDisplay: true, position: "bottomleft" }
).addTo(map);

/* ---------------------------------
   LECTURA DE CSV POR AÑO
--------------------------------- */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSKeiBBKiYlwHasbQMehxNAL7d4gbjb57bHVnVc4Ui5NWr5XetoTGtMGdd4KRoMWAkXDyuCcRbx0oj8/pub?output=csv";

const datosPorAnio = {};
const markersPorAnio = {};
let anioActivo = null;

Papa.parse(CSV_URL, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: res => {
    res.data.forEach(r => {
      const anio = (r["AÑO"] || "").trim();
      if (!anio) return;
      if (!datosPorAnio[anio]) datosPorAnio[anio] = [];
      datosPorAnio[anio].push(r);
    });

    crearBotonesAnios();
    crearCapas();
    activarAnio(Object.keys(datosPorAnio).sort()[0]);
  }
});

/* ---------------------------------
   BOTONES DINÁMICOS
--------------------------------- */
function crearBotonesAnios() {
  const cont = document.getElementById("botones-anio");
  Object.keys(datosPorAnio).sort().forEach(a => {
    const b = document.createElement("div");
    b.className = "boton-anio";
    b.textContent = a;
    b.id = "boton-anio-"+a;
    b.onclick = () => activarAnio(a);
    cont.appendChild(b);
  });
}

/* ---------------------------------
   CREAR MARCADORES
--------------------------------- */
function crearCapas() {
  Object.keys(datosPorAnio).forEach(a => {
    const capa = L.layerGroup();
    datosPorAnio[a].forEach(r => {
      const lat = parseFloat(r["LATITUD DECIMAL"]?.replace(",", "."));
      const lon = parseFloat(r["LONGITUD DECIMAL"]?.replace(",", "."));
      if (isNaN(lat) || isNaN(lon)) return;

      const vereda = r["CORREGIMIENTO O VEREDA"] || "";
      const muni = r["MUNICIPIO"] || "";

      const filas = datosPorAnio[a].filter(f => f["CORREGIMIENTO O VEREDA"] === vereda && f["LATITUD DECIMAL"] === r["LATITUD DECIMAL"]);

      const content = `
        <b>Municipio:</b> ${muni}<br>
        <b>Vereda:</b> ${vereda}<br><br>
        <b>Fuentes:</b><br>
        ${filas.map(f => {
          const data = encodeURIComponent(JSON.stringify(f));
          return `<a href="#" onclick="showFuente(${lat},${lon},'${data}')">${f["FUENTE"]}</a>`;
        }).join("<br>")}
      `;

      const mk = L.marker([lat,lon], { icon: iconosPersonalizados[a] || iconDefault })
        .bindPopup(content);

      capa.addLayer(mk);
    });
    markersPorAnio[a] = capa;
  });
}

window.showFuente = (lat,lon,data) => {
  const f = JSON.parse(decodeURIComponent(data));
  const html = `
    <b>${(f["FUENTE"]||"").toUpperCase()}</b><br><br>
    <b>No. autorización:</b> ${f["NO. AUTORIZACIÓN"]}<br>
    <b>Fecha:</b> ${f["FECHA AUTORIZACIÓN"]}<br>
    <b>Anexo:</b> <a href="${f["ANEXO"]}" target="_blank">VER</a><br>
    <b>Autorización:</b> <a href="${f["AUTORIZACION SANITARIA"]}" target="_blank">VER</a>
  `;
  L.popup({maxWidth:350}).setLatLng([lat,lon]).setContent(html).openOn(map);
};

/* ---------------------------------
   ACTIVAR AÑO
--------------------------------- */
function activarAnio(a) {
  if (anioActivo && markersPorAnio[anioActivo]) map.removeLayer(markersPorAnio[anioActivo]);
  anioActivo = a;
  map.addLayer(markersPorAnio[a]);

  document.querySelectorAll(".boton-anio").forEach(b => b.classList.remove("activo"));
  document.getElementById("boton-anio-"+a).classList.add("activo");

  const first = markersPorAnio[a].getLayers()[0];
  if (first) map.setView(first.getLatLng(), 10);

  document.getElementById("nota-ano").textContent = "Año activo: " + a;
}

/* ---------------------------------
   BUSCADOR
--------------------------------- */
document.getElementById("btn-buscar").onclick = () => {
  const q = document.getElementById("input-buscar").value.toLowerCase().trim();
  if (!q) return alert("Escribe algo para buscar.");
  if (!anioActivo) return alert("Activa un año.");

  const filas = datosPorAnio[anioActivo];
  const f = filas.find(r =>
    (r["MUNICIPIO"] || "").toLowerCase().includes(q) ||
    (r["FUENTE"] || "").toLowerCase().includes(q)
  );

  if (!f) return alert("No hay resultados.");

  const lat = parseFloat(f["LATITUD DECIMAL"].replace(",", "."));
  const lon = parseFloat(f["LONGITUD DECIMAL"].replace(",", "."));

  map.setView([lat,lon], 13);

  let closest = null;
  let minDist = Infinity;
  markersPorAnio[anioActivo].eachLayer(m => {
    const d = m.getLatLng().distanceTo([lat,lon]);
    if (d < minDist) { minDist = d; closest = m; }
  });

  if (closest) closest.openPopup();
};

document.getElementById("btn-reset").onclick = () => {
  document.getElementById("input-buscar").value = "";
  const first = markersPorAnio[anioActivo].getLayers()[0];
  if (first) map.setView(first.getLatLng(), 10);
};

</script>
</body>
</html>
