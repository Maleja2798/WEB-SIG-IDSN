<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Visor SIG Autorizaciones Sanitarias</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; background: black; font-family: 'Arial Narrow', sans-serif; color: white; }
    #map { height: 90vh; }
    h1 { text-align: center; padding: 10px; font-size: 24px; }
    .botones { text-align: center; margin-bottom: 10px; }
    .botones button {
      background: transparent;
      border: 1px solid white;
      color: white;
      padding: 8px 16px;
      margin: 0 5px;
      cursor: pointer;
      border-radius: 5px;
    }
    .botones button:hover { background: white; color: black; }
  </style>
</head>
<body>
  <h1>Visor SIG - Autorizaciones Sanitarias de Agua</h1>
  <div class="botones">
    <button onclick="mostrarDatos(2023)">2023</button>
    <button onclick="mostrarDatos(2024)">2024</button>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const map = L.map('map').setView([1.2, -77.3], 8);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let capa2023 = L.layerGroup().addTo(map);
    let capa2024 = L.layerGroup();

    function limpiarCapas() {
      capa2023.clearLayers();
      capa2024.clearLayers();
    }

    function cargarCSV(url, capa) {
      Papa.parse(url, {
        download: true,
        header: true,
        complete: function(result) {
          result.data.forEach(fila => {
            const lat = parseFloat(fila["LATITUD DECIMAL"]);
            const lon = parseFloat(fila["LONGITUD DECIMAL"]);

            if (!isNaN(lat) && !isNaN(lon)) {
              const popup = `<b>${fila.MUNICIPIO}</b><br>
                             Vereda/Corregimiento: ${fila["VEREDA O CORREGIMIENTO"] || 'N/D'}<br>
                             Fuente: ${fila.FUENTE || 'N/D'}<br>
                             <a href="#" onclick="mostrarDetalle('${fila.FUENTE || ''}', '${fila.MUNICIPIO || ''}')">Ver detalle</a>`;

              L.circleMarker([lat, lon], {
                radius: 6,
                fillColor: '#00ffff',
                color: '#00ffff',
                weight: 1,
                fillOpacity: 0.8
              }).bindPopup(popup).addTo(capa);
            }
          });
        }
      });
    }

    function mostrarDatos(anio) {
      limpiarCapas();
      map.eachLayer(layer => {
        if (layer instanceof L.CircleMarker) map.removeLayer(layer);
      });

      if (anio === 2023) {
        cargarCSV("https://docs.google.com/spreadsheets/d/e/2PACX-1vQEIfxPwnfsK29s70MMP_eimRMxEIeTyWye0GIsUAslrRrWalcULyXwWlSiyZenbJ_r4-ww-vBHBnun/pub?output=csv", capa2023);
        capa2023.addTo(map);
      } else if (anio === 2024) {
        cargarCSV("https://docs.google.com/spreadsheets/d/e/2PACX-1vR1J7LR3iLUUooYvEDJ_ZwbQOjABz08K_rqUgYt0qqcIA93iNHY5Hb9dCEgkq-iZbsQdLfgs6-V84D6/pub?output=csv", capa2024);
        capa2024.addTo(map);
      }
    }

    function mostrarDetalle(fuente, municipio) {
      alert(`Detalle de la fuente: ${fuente}\nMunicipio: ${municipio}`);
    }
  </script>
</body>
</html>
