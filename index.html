<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa de Autorizaciones Sanitarias de Agua en Nariño</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-minimap/dist/Control.MiniMap.min.css" />
  <script src="https://unpkg.com/leaflet-minimap/dist/Control.MiniMap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "Arial Narrow", sans-serif;
      background-color: black;
      color: white;
    }
    h1 {
      text-align: center;
      background-color: rgba(0.1, 0.5, 0.5, 0.4);
      padding: 7px;
      font-size: 24px;
      font-weight: bold;
      font-family: "Arial Narrow", sans-serif;
      color: white;
      backdrop-filter: blur(3px);
    }
    #map {
      height: 90vh;
      width: 100%;
    }
    #botones-anio {
      position: absolute;
      bottom: 40px;
      right: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .boton-anio {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid white;
      padding: 6px 12px;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }
    .boton-anio:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <h1>MAPA DE AUTORIZACIONES SANITARIAS DE AGUA EN NARIÑO</h1>
  <div id="map"></div>
  <div id="botones-anio"></div>

  <script>
    // --- Inicialización básica del mapa (igual que antes)
    const map = L.map("map", { zoomControl: false }).setView([1.289, -77.29], 8);

    const norteControl = L.control({ position: 'topleft' });
    norteControl.onAdd = function () {
      const div = L.DomUtil.create('div', 'info norte');
      div.innerHTML = `<img src="NORTE.png" alt="Norte" style="width: 50px;">`;
      return div;
    };
    norteControl.addTo(map);

    map.createPane("marcadores");
    map.getPane("marcadores").style.zIndex = 650;

    const baseMaps = {
      "Mapa Estándar": L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map),
      "Satélite (ESRI)": L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
        attribution: "Tiles &copy; Esri",
      }),
      "Topográfico": L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenTopoMap contributors",
      }),
    };
    L.control.layers(baseMaps, null, { position: "topright" }).addTo(map);
    L.control.zoom({ position: "topright" }).addTo(map);
    L.control.scale({ position: "bottomright", metric: true, imperial: false }).addTo(map);
    L.Control.geocoder({ defaultMarkGeocode: true }).on("markgeocode", e => {
      map.setView(e.geocode.center, 12);
    }).addTo(map);
    // evitar fallo si no existe el icono de geocoder aún
    if (document.querySelector(".leaflet-control-geocoder-icon")) {
      document.querySelector(".leaflet-control-geocoder-icon").title = "Buscar";
    }
    new L.Control.MiniMap(
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"),
      { toggleDisplay: true, position: "bottomleft" }
    ).addTo(map);

    let geojsonLayer; // permanece igual

    // ICONOS personalizados por año (si no hay icono para un año, fallback al predeterminado)
    const iconDefault = L.icon({ iconUrl: 'MARCADOR1.png', iconSize: [32,32], iconAnchor:[16,32], popupAnchor:[0,-32] });
    const iconosPersonalizados = {
      "2023": L.icon({ iconUrl: 'MARCADOR1.png', iconSize: [32,32], iconAnchor:[16,32], popupAnchor:[0,-32] }),
      "2024": L.icon({ iconUrl: 'MARCADOR2.png', iconSize: [32,32], iconAnchor:[16,32], popupAnchor:[0,-32] }),
      "2025": L.icon({ iconUrl: 'MARCADOR3.png', iconSize: [32,32], iconAnchor:[16,32], popupAnchor:[0,-32] })
      // Nuevos años pueden no tener icono; se usará iconDefault
    };

    // Paleta y funciones del GeoJSON (sin cambios significativos)
    const colores = [
      "#63C5DA", "#52B2BF", "#82EEFD", "#0492C2", "#00BFFF", "#1877F2",
      "#B2FFFF", "#AFEEEE", "#ADD8E6", "#7DF9FF", "#89CFF0", "#A1CAF1",
      "#4682B4", "#73C2FB", "#6495ED", "#AFDBF5", "#15F4EE"
    ];
    function getColor(nombre) {
      let hash = 0;
      for (let i = 0; i < nombre.length; i++) {
        hash = nombre.charCodeAt(i) + ((hash << 5) - hash);
      }
      const index = Math.abs(hash % colores.length);
      return colores[index];
    }
    function estiloBase(feature) {
      return { color: "white", weight: 2, fillOpacity: 0.6, fillColor: getColor(feature.properties.NOMBRE_ENT) };
    }
    function highlightFeature(e) {
      const layer = e.target;
      layer.setStyle({ weight: 3, color: '#FFFF00', fillOpacity: 0.7 });
      layer.bringToFront();
    }
    function resetHighlight(e) {
      geojsonLayer.resetStyle(e.target);
    }
    function onEachFeature(feature, layer) {
      const nombreMunicipio = feature.properties.NOMBRE_ENT;
      const nombreFormateado = nombreMunicipio ? nombreMunicipio.charAt(0).toUpperCase() + nombreMunicipio.slice(1).toLowerCase() : 'Desconocido';
      layer.bindPopup(`<b>MUNICIPIO</b><br>${nombreFormateado}`);
      layer.on({ mouseover: highlightFeature, mouseout: resetHighlight, click: function (e) { layer.openPopup(); map.fitBounds(layer.getBounds()); } });
    }
    fetch("https://raw.githubusercontent.com/Maleja2798/WEB-SIG-IDSN/main/Municipios_Nari%C3%B1o.geojson")
      .then(response => response.json())
      .then(data => {
        geojsonLayer = L.geoJson(data, { style: estiloBase, onEachFeature: onEachFeature }).addTo(map);
        geojsonLayer.bringToBack();
        const controlSearch = new L.Control.Search({ layer: geojsonLayer, propertyName: 'NOMBRE_ENT', initial: false, zoom: 10, marker: false });
        map.addControl(controlSearch);
      })
      .catch(err => console.error("Error cargando GeoJSON:", err));

    // ------------------------
    //  LECTURA DINÁMICA DE HOJAS (OPCIÓN B)
    // ------------------------
    // ID de tu Google Sheet (debe ser público "Cualquiera con el enlace puede ver")
    const SHEET_ID = "1CaP8YHPrszoh32dKQgZZY2yb6SR462fDVBvX_bIfyDU";

    // Contenedores: layers por año/hoja y lista de años encontrados
    const markers = {}; // markers["2023"] = L.layerGroup()
    let añosOrden = [];  // orden de las hojas detectadas

    // 1) Obtener la lista de hojas del spreadsheet (feed público)
    async function obtenerHojasPublicas(sheetId) {
      // Endpoint de worksheets feed (funciona si el sheet es público)
      const url = `https://spreadsheets.google.com/feeds/worksheets/${sheetId}/public/basic?alt=json`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("No se pudo leer la lista de hojas. ¿El Sheet está público?");
      const json = await res.json();
      const entries = json.feed.entry || [];
      // Extraer nombres de hojas
      return entries.map(e => e.title.$t);
    }

    // 2) Para cada hoja (nombre) convertir a CSV mediante endpoint gviz/tq
    function csvUrlPorHoja(sheetId, hojaNombre) {
      return `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(hojaNombre)}`;
    }

    // 3) Crear botón en UI
    function crearBotonAnio(nombreHoja) {
      const cont = document.getElementById("botones-anio");
      const btn = document.createElement("div");
      btn.className = "boton-anio";
      btn.textContent = nombreHoja;
      btn.onclick = () => mostrarCapa(nombreHoja);
      cont.appendChild(btn);
    }

    // 4) Parsear CSV y crear marcadores (misma estructura que tu lógica)
    function cargarCsvYCrearCapas(nombreHoja, urlCsv) {
      // Inicializar layerGroup para la hoja
      markers[nombreHoja] = L.layerGroup();
      // Papa.parse
      Papa.parse(urlCsv, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: results => {
          const puntos = {};
          results.data.forEach(row => {
            // Campos esperados (tal como en tus hojas)
            const vereda = row["CORREGIMIENTO O VEREDA"]?.trim();
            const lat = parseFloat((row["LATITUD DECIMAL"] || "").replace(",", "."));
            const lon = parseFloat((row["LONGITUD DECIMAL"] || "").replace(",", "."));
            if (!vereda || isNaN(lat) || isNaN(lon)) return;
            const key = vereda + "_" + lat + "_" + lon; // agrupar por vereda+coord
            if (!puntos[key]) puntos[key] = {
              municipio: row["MUNICIPIO"]?.trim() || "Desconocido",
              vereda: vereda,
              lat: lat,
              lon: lon,
              fuentes: []
            };
            puntos[key].fuentes.push({
              fuente: row["FUENTE"]?.trim(),
              no_aut: row["NO. AUTORIZACION"]?.trim(),
              fecha: row["FECHA AUTORIZACION"]?.trim(),
              anexo: row["ANEXO"]?.trim(),
              // si en el futuro agregan más columnas, las puedes acceder por nombre
            });
          });

          // Crear marcadores por grupo
          Object.values(puntos).forEach((entry, index) => {
            // Formato del primer cuadro (popup) — Municipio / Vereda / Fuentes como links (que abren cuadro detalle)
            // Para seguridad en el onclick, pasamos la fuente codificada con encodeURIComponent
            const contentVereda = `
              <div style="font-family: Arial Narrow, sans-serif; font-size: 13px; color: white;">
                <div><b>Municipio:</b> ${entry.municipio}</div>
                <div style="margin-top: 6px;"><b>Vereda:</b> ${entry.vereda}</div>
                <div style="margin-top: 6px;"><b>La Fuente:</b><br>
                  ${entry.fuentes.map(f => {
                    const tituloFuente = (f.fuente || '').charAt(0).toUpperCase() + (f.fuente || '').slice(1).toLowerCase();
                    // codificamos el objeto fuente para pasarlo seguro al onclick
                    const jsonEnc = encodeURIComponent(JSON.stringify(f));
                    // showFuenteEncoded decodifica y abre cuadro 2
                    return `<a href="#" onclick="showFuenteEncoded(${entry.lat}, ${entry.lon}, '${jsonEnc}'); return false;" style="color: #00BFFF; display:block; margin-top: 2px;">${tituloFuente}</a>`;
                  }).join("")}
                </div>
              </div>
            `;
            // Elegir icono: si existe uno para este nombre de hoja, úsalo; si no, fallback
            const icono = iconosPersonalizados[nombreHoja] || iconosPersonalizados[nombreHoja.toString()] || iconDefault;
            const marker = L.marker([entry.lat, entry.lon], { pane: "marcadores", icon: icono }).bindPopup(contentVereda);
            markers[nombreHoja].addLayer(marker);
          });

          // Si esta es la PRIMERA hoja (primer año detectado), la añadimos por defecto al mapa
          if (añosOrden.length && map && !mapHasAnyMarkerLayer()) {
            map.addLayer(markers[añosOrden[0]]);
          }
        },
        error: err => console.error("Error al parsear CSV (hoja " + nombreHoja + "):", err)
      });
    }

    // Helper: comprobar si ya hay alguna layer de markers añadida al mapa
    function mapHasAnyMarkerLayer() {
      for (const k in markers) {
        if (markers[k] && map.hasLayer(markers[k])) return true;
      }
      return false;
    }

    // showFuenteEncoded: recibe json codificado por encodeURIComponent
    function showFuenteEncoded(lat, lon, jsonEnc) {
      try {
        const f = JSON.parse(decodeURIComponent(jsonEnc));
        const content = `
          <div style="font-family: 'Arial Narrow', sans-serif; font-size: 13px; color: white;">
            <div style="font-weight: bold; text-transform: uppercase; margin-bottom: 6px;">${f.fuente || ''}</div>
            <div><b>No. AUTORIZACION:</b><br>${f.no_aut || ''}</div>
            <div style="margin-top: 6px;"><b>FECHA AUTORIZACION:</b><br>${f.fecha || ''}</div>
            <div style="margin-top: 6px;"><b>ANEXO:</b><br><a href="${f.anexo || '#'}" target="_blank" style="color: #00BFFF;">VER</a></div>
            <div style="margin-top: 6px;"><b>AUTORIZACION SANITARIA:</b><br><a href="${f.anexo || '#'}" target="_blank" style="color: #00BFFF;">VER</a></div>
          </div>
        `;
        L.popup({ maxWidth: 350 }).setLatLng([lat, lon]).setContent(content).openOn(map);
      } catch (e) {
        console.error("Error showFuenteEncoded:", e);
      }
    }

    // mostrarCapa: ocultar todas y mostrar la pedida
    function mostrarCapa(nombreHoja) {
      // quitar todas las capas markers
      for (const k in markers) {
        if (markers[k] && map.hasLayer(markers[k])) map.removeLayer(markers[k]);
      }
      // añadir la pedida si existe
      if (markers[nombreHoja]) {
        map.addLayer(markers[nombreHoja]);
      } else {
        console.warn("No hay datos cargados para la hoja:", nombreHoja);
      }
    }

    // FUNCIÓN PRINCIPAL: detectar hojas, crear botones y cargar CSVs
    async function initHojasYCapas() {
      try {
        const hojas = await obtenerHojasPublicas(SHEET_ID);
        if (!hojas || hojas.length === 0) {
          throw new Error("No se detectaron hojas en el spreadsheet. ¿Está público?");
        }

        // ordenar alfabeticamente (opcional) pero mejor mantener el orden tal cual vino
        añosOrden = hojas.slice();

        // crear botón por cada hoja y cargar su CSV
        añosOrden.forEach((nombreHoja, idx) => {
          crearBotonAnio(nombreHoja);
          // inicializamos grupo vacío
          markers[nombreHoja] = L.layerGroup();
          // construir URL CSV y cargar
          const csvUrl = csvUrlPorHoja(SHEET_ID, nombreHoja);
          cargarCsvYCrearCapas(nombreHoja, csvUrl);
        });
      } catch (err) {
        console.error("Error inicializando hojas:", err);
        alert("No se pudo cargar las hojas automáticamente. Verifica que el archivo sea público (Cualquiera con el enlace → Puede ver).");
      }
    }

    // Inicializar
    initHojasYCapas();

    // Exponer showFuenteEncoded para onclick en HTML generado
    window.showFuenteEncoded = showFuenteEncoded;
    window.mostrarCapa = mostrarCapa;

    // --- fin del script principal ---
  </script>
</body>
</html>
