<!DOCTYPE html>
<html>
<head>
  <title>Visor SIG Autorizaciones Sanitarias - IDSN</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      font-family: "Arial Narrow", sans-serif;
      background-color: black;
    }
    .leaflet-control-zoom a {
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      font-weight: bold;
      box-shadow: 0px 0px 5px #888;
    }
    .leaflet-bar a {
      border-radius: 5px;
    }
    .leaflet-popup-content {
      font-family: "Arial Narrow", sans-serif;
      font-size: 13px;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  const map = L.map('map').setView([1.2136, -77.2811], 8); // Centrado en Nariño

  // Mapa base estilo satélite tipo Google Earth Pro
  const satelite = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
    maxZoom: 20,
    attribution: '&copy; Google Maps'
  }).addTo(map);

  // Escala
  L.control.scale({ position: 'bottomright' }).addTo(map);

  // Botones de Zoom personalizados ya están con estilos

  // Geocoder
  L.Control.geocoder({
    defaultMarkGeocode: true,
    placeholder: "Buscar municipio...",
    showResultIcons: false
  }).addTo(map);

</script>

</body>
</html>
