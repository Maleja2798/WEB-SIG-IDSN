<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Autorizaciones Sanitarias de Agua en Nariño</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-minimap/dist/Control.MiniMap.min.css" />
  <script src="https://unpkg.com/leaflet-minimap/dist/Control.MiniMap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>/*...ESTILOS MANTENIDOS COMO TU DIJISTE...*/</style>
</head>
<body>
  <h1>MAPA DE AUTORIZACIONES SANITARIAS DE AGUA EN NARIÑO</h1>
  <div id="map"></div>
  <div id="botones-anio">
    <div class="boton-anio" onclick="mostrarCapa(2023)">2023</div>
    <div class="boton-anio" onclick="mostrarCapa(2024)">2024</div>
  </div>

<script>
  var map = L.map('map', { zoomControl: false }).setView([1.289, -77.29], 8);
  var baseMaps = { /*...MANTENIDO IGUAL...*/ };
  L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);
  L.control.zoom({ position: 'topright' }).addTo(map);

  fetch('https://raw.githubusercontent.com/Maleja2798/WEB-SIG-IDSN/main/Munip_Nari%C3%B1o.geojson')
    .then(response => response.json())
    .then(data => {
      var geojsonLayer = L.geoJson(data, {
        style: function() {
          return {
            color: 'white', weight: 1,
            fillColor: getRandomBlueColor(), fillOpacity: 0.7
          };
        },
        onEachFeature: function(feature, layer) {
          var nombreMunicipio = feature.properties.NOMBRE_ENT || "Sin nombre";
          layer.bindPopup("<b>MUNICIPIO:</b> <span style='font-family: Arial Narrow;'>" + nombreMunicipio + "</span>");
          layer.on('click', function() {
            geojsonLayer.resetStyle();
            layer.setStyle({
              color: 'yellow', weight: 3,
              fillColor: 'orange', fillOpacity: 0.7
            });
            map.fitBounds(layer.getBounds());
          });
        }
      }).addTo(map);
    });

  var northIcon = L.control({ position: "topleft" });
  northIcon.onAdd = function(map) {
    var div = L.DomUtil.create("div", "north-icon");
    div.innerHTML = '<img src="https://raw.githubusercontent.com/Maleja2798/WEB-SIG-IDSN/main/NORTE.png" width="50px"/>';
    return div;
  };
  northIcon.addTo(map);

  L.control.scale({ position: "bottomright", metric: true, imperial: false }).addTo(map);
  L.Control.geocoder({ defaultMarkGeocode: true }).addTo(map);
  var miniMapLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
  new L.Control.MiniMap(miniMapLayer, { toggleDisplay: true, position: 'bottomleft' }).addTo(map);

  const capa2023 = L.layerGroup();
  const capa2024 = L.layerGroup();

  function cargarCSV(url, capaGrupo, color) {
    Papa.parse(url, {
      download: true,
      header: true,
      complete: function(results) {
        const datos = results.data;
        datos.forEach(row => {
          const lat = parseFloat(row["LATITUD DECIMAL"]);
          const lon = parseFloat(row["LONGITUD DECIMAL"]);
          if (!isNaN(lat) && !isNaN(lon)) {
            const marcador = L.marker([lat, lon], {
              icon: L.divIcon({
                className: 'custom-div-icon',
                html: `<div style="background:${color};border-radius:10px;padding:2px 5px;font-family:'Arial Narrow';color:white">➔</div>`,
                iconSize: [20, 20],
                iconAnchor: [10, 10]
              })
            });
            marcador.bindPopup(`
              <div style="font-family:'Arial Narrow'; font-size:13px;">
                <b>Municipio:</b> ${row["MUNICIPIO"] || row["MUNICIPIOS"]}<br>
                <b>Corregimiento o Vereda:</b> ${row["CORREGIMIENTO O VEREDA"]}<br>
                <b>Fuente:</b> ${row["FUENTE"]}<br>
                <b>Nº Autorización:</b> ${row["NO. AUTORIZACION"]}<br>
                <b>Fecha Autorización:</b> ${row["FECHA AUTORIZACION"]}<br>
                ${row["ANEXO"] ? `<b>Anexo:</b> <a href="${row["ANEXO"]}" target="_blank">Ver</a>` : ""}
              </div>`);
            marcador.addTo(capaGrupo);
          }
        });
      }
    });
  }

  function mostrarCapa(anio) {
    map.removeLayer(capa2023);
    map.removeLayer(capa2024);
    if (anio === 2023) capa2023.addTo(map);
    else if (anio === 2024) capa2024.addTo(map);
  }

  cargarCSV(
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vR9MXHFzd2BkQkYDlCp3TS0vLQr6JCzV-prDxyNErrCiXHAnHnKjH95Z1es_jhYbRwnI2C5mZgW0Ccr/pub?gid=0&single=true&output=csv',
    capa2023, '#00bfff');

  cargarCSV(
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vQEIfxPwnfsK29s70MMP_eimRMxEIeTyWye0GIsUAslrRrWalcULyXwWlSiyZenbJ_r4-ww-vBHBnun/pub?gid=0&single=true&output=csv',
    capa2024, '#ff4500');
</script>
</body>
</html>
