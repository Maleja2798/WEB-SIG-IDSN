<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa de Autorizaciones Sanitarias de Agua en Nariño</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-minimap/dist/Control.MiniMap.min.css" />
  <script src="https://unpkg.com/leaflet-minimap/dist/Control.MiniMap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Arial Narrow", sans-serif;
      background-color: black;
      color: black;
    }
    h1 {
      text-align: center;
      background-color: rgba(0.1, 0.5, 0.5, 0.4);
      padding: 7px;
      font-size: 24px;
      font-weight: bold;
      font-family: "Arial Narrow", sans-serif;
      color: white;
      backdrop-filter: blur(3px);
    }
    #map {
      height: 90vh;
      width: 100%;
    }
    #botones-anio {
      position: absolute;
      bottom: 40px;
      right: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .boton-anio {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid white;
      padding: 6px 12px;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      text-align: center;
    }
    .boton-anio:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Estilos para el popup detalle (asegurar Arial Narrow) */
    .popup-detalle {
      font-family: "Arial Narrow", sans-serif;
      font-size: 13px;
      color: #000;
    }
    .popup-main {
      font-family: "Arial Narrow", sans-serif;
      font-size: 13px;
      color: #000;
    }

    /* Cuando los popups usan fondo oscuro del mapa, obligamos estilo inline en el contenido para visibilidad */
  </style>
</head>
<body>
  <h1>MAPA DE AUTORIZACIONES SANITARIAS DE AGUA EN NARIÑO</h1>
  <div id="map"></div>
  <div id="botones-anio">
    <!-- Los botones fijos quedan pero también se generarán botones dinámicos -->
    <div class="boton-anio" onclick="mostrarCapa(2023)">2023</div>
    <div class="boton-anio" onclick="mostrarCapa(2024)">2024</div>
    <div class="boton-anio" onclick="mostrarCapa(2025)">2025</div>
  </div>

  <script>
    // -------------------------
    // Configuración inicial mapa
    // -------------------------
    const map = L.map("map", { zoomControl: false }).setView([1.289, -77.29], 8);

    const norteControl = L.control({ position: 'topleft' });
    norteControl.onAdd = function () {
      const div = L.DomUtil.create('div', 'info norte');
      div.innerHTML = `<img src="NORTE.png" alt="Norte" style="width: 50px;">`;
      return div;
    };
    norteControl.addTo(map);

    map.createPane("marcadores");
    map.getPane("marcadores").style.zIndex = 650;

    const baseMaps = {
      "Mapa Estándar": L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map),
      "Satélite (ESRI)": L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
        attribution: "Tiles &copy; Esri",
      }),
      "Topográfico": L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenTopoMap contributors",
      }),
    };
    L.control.layers(baseMaps, null, { position: "topright" }).addTo(map);
    L.control.zoom({ position: "topright" }).addTo(map);
    L.control.scale({ position: "bottomright", metric: true, imperial: false }).addTo(map);
    L.Control.geocoder({ defaultMarkGeocode: true }).on("markgeocode", e => {
      map.setView(e.geocode.center, 12);
    }).addTo(map);
    // proteger si el control geocoder no se cargó aún
    const geocoderIcon = document.querySelector(".leaflet-control-geocoder-icon");
    if (geocoderIcon) geocoderIcon.title = "Buscar";

    new L.Control.MiniMap(
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"),
      { toggleDisplay: true, position: "bottomleft" }
    ).addTo(map);

    let geojsonLayer;

    // ICONOS por año (usa tus ficheros subidos en repo)
    const iconosPersonalizados = {
      2023: L.icon({ iconUrl: 'MARCADOR1.png', iconSize: [32,32], iconAnchor:[16,32], popupAnchor:[0,-32] }),
      2024: L.icon({ iconUrl: 'MARCADOR2.png', iconSize: [32,32], iconAnchor:[16,32], popupAnchor:[0,-32] }),
      2025: L.icon({ iconUrl: 'MARCADOR3.png', iconSize: [32,32], iconAnchor:[16,32], popupAnchor:[0,-32] })
    };

    // Colores municipios (sin tocar)
    const colores = [ "#63C5DA","#52B2BF","#82EEFD","#0492C2","#00BFFF","#1877F2","#B2FFFF","#AFEEEE","#ADD8E6","#7DF9FF","#89CFF0","#A1CAF1","#4682B4","#73C2FB","#6495ED","#AFDBF5","#15F4EE" ];
    function getColor(nombre) { let hash = 0; for (let i=0;i<nombre.length;i++){ hash = nombre.charCodeAt(i) + ((hash<<5)-hash); } const index = Math.abs(hash % colores.length); return colores[index]; }
    function estiloBase(feature){ return { color:"white", weight:2, fillOpacity:0.6, fillColor: getColor(feature.properties.NOMBRE_ENT) }; }
    function highlightFeature(e){ const layer = e.target; layer.setStyle({ weight:3, color:'#FFFF00', fillOpacity:0.7 }); layer.bringToFront(); }
    function resetHighlight(e){ if (geojsonLayer) geojsonLayer.resetStyle(e.target); }
    function onEachFeature(feature, layer){
      const nombreMunicipio = feature.properties.NOMBRE_ENT;
      const nombreFormateado = nombreMunicipio ? nombreMunicipio.charAt(0).toUpperCase() + nombreMunicipio.slice(1).toLowerCase() : 'Desconocido';
      layer.bindPopup(`<b>MUNICIPIO</b><br>${nombreFormateado}`);
      layer.on({ mouseover: highlightFeature, mouseout: resetHighlight, click: function(e){ layer.openPopup(); map.fitBounds(layer.getBounds()); }});
    }

    // cargar geojson (sin tocar)
    fetch("https://raw.githubusercontent.com/Maleja2798/WEB-SIG-IDSN/main/Municipios_Nari%C3%B1o.geojson")
      .then(r=>r.json()).then(data=>{
        geojsonLayer = L.geoJson(data, { style: estiloBase, onEachFeature: onEachFeature }).addTo(map);
        geojsonLayer.bringToBack();
        // control búsqueda (si está disponible)
        if (L.Control.Search) {
          const controlSearch = new L.Control.Search({ layer: geojsonLayer, propertyName: 'NOMBRE_ENT', initial:false, zoom:10, marker:false });
          map.addControl(controlSearch);
        }
      });

    // -------------------------
    // CARGA DE DATOS: UN SOLO CSV PÚBLICO (tu link publicado)
    // -------------------------
    // URL CSV publicado (reemplaza por la que enviaste si quieres otra)
    const csvPublico = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSKeiBBKiYlwHasbQMehxNAL7d4gbjb57bHVnVc4Ui5NWr5XetoTGtMGdd4KRoMWAkXDyuCcRbx0oj8/pub?output=csv";

    // markers por año (objetos LayerGroup)
    const markers = {};

    // función para obtener nombre de año en la fila: chequeamos varias cabeceras
    function detectYearField(headers) {
      const posibles = ['AÑO','ANIO','ANIO ','ANIO(YYYY)','YEAR','HOJA','ANIO','Año'];
      for (const p of posibles) {
        if (headers.includes(p)) return p;
      }
      // también verificar versiones en minúsc/acentos
      for (const h of headers) {
        const key = h.toString().trim().toUpperCase();
        if (['AÑO','ANIO','YEAR','HOJA'].includes(key)) return h;
      }
      return null;
    }

    // nombre de columnas esperadas (según tu formato)
    // soportamos: MUNICIPIO, CORREGIMIENTO O VEREDA, FUENTE, NO. AUTORIZACION, FECHA AUTORIZACION, LATITUD DECIMAL, LONGITUD DECIMAL, ANEXO
    function normalizeKey(k){
      if(!k) return k;
      return k.toString().trim().toUpperCase();
    }

    // cargar CSV con PapaParse
    Papa.parse(csvPublico, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: results => {
        const data = results.data || [];
        if (!data.length) {
          console.error("CSV vacío o no cargado.");
          return;
        }

        // detectar headers reales
        const headers = Object.keys(data[0]).map(h => h.toString().trim());
        const yearField = detectYearField(headers);

        // agrupar por año y luego por vereda+coords
        const porAno = {}; // { "2023": { "<vereda>_<lat>_<lon>": { municipio, vereda, lat, lon, fuentes: [] } } }

        data.forEach(row => {
          // normalizar claves para leer
          const municipio = row["MUNICIPIO"] ?? row["Municipio"] ?? row["municipio"] ?? row["MUNICIPIO "] ?? row["MUNICIPIO".trim()] ?? row["MUNICIPIO"];
          const vereda = row["CORREGIMIENTO O VEREDA"] ?? row["CORREGIMIENTO O VEREDA".trim()] ?? row["Corregimiento o Vereda"] ?? row["VEREDA"] ?? row["CORREGIMIENTO"] ?? row["CORREGIMIENTO O VEREDA"];
          const fuente = row["FUENTE"] ?? row["Fuente"] ?? row["fuente"];
          const no_aut = row["NO. AUTORIZACION"] ?? row["NO. AUTORIZACION".trim()] ?? row["NO AUTORIZACION"] ?? row["NÚMERO AUTORIZACION"] ?? row["NO. AUTORIZACIÓN"] ?? row["NO. AUTORIZACIÓN"];
          const fecha = row["FECHA AUTORIZACION"] ?? row["FECHA AUTORIZACIÓN"] ?? row["FECHA"] ?? row["Fecha"];
          const anexo = row["ANEXO"] ?? row["Anexo"] ?? row["ENLACE"] ?? row["LINK"];
          const latRaw = row["LATITUD DECIMAL"] ?? row["Latitud Decimal"] ?? row["LATITUD"] ?? row["latitud"];
          const lonRaw = row["LONGITUD DECIMAL"] ?? row["Longitud Decimal"] ?? row["LONGITUD"] ?? row["longitud"];

          let lat = parseFloat((latRaw||"").toString().replace(",","."));
          let lon = parseFloat((lonRaw||"").toString().replace(",","."));
          if (isNaN(lat) || isNaN(lon)) return; // saltar si no hay coordenadas

          // detectar año
          let año = "2023"; // fallback
          if (yearField) {
            const yearVal = row[yearField];
            if (yearVal) año = yearVal.toString().trim();
          } else {
            // intentar columnas alternativas: "AÑO" en cualquier key
            const possibleYear = Object.keys(row).find(k => k && k.toString().trim().toUpperCase().includes("AÑO") || (k && k.toString().trim().toUpperCase().includes("ANIO")));
            if (possibleYear) año = (row[possibleYear]||"2023").toString().trim();
            else {
              // fallback: si la hoja tiene columna "FECHA AUTORIZACION" y tiene año, extraemos el año
              if (fecha) {
                const yMatch = fecha.toString().match(/(\d{4})/);
                if (yMatch) año = yMatch[1];
              }
            }
          }

          if (!porAno[año]) porAno[año] = {};

          const key = `${(vereda||"").trim()}_${lat}_${lon}`;
          if (!porAno[año][key]) {
            porAno[año][key] = {
              municipio: (municipio||"Desconocido").toString().trim(),
              vereda: (vereda||"").toString().trim(),
              lat, lon,
              fuentes: []
            };
          }

          porAno[año][key].fuentes.push({
            fuente: (fuente||"").toString().trim(),
            no_aut: (no_aut||"").toString().trim(),
            fecha: (fecha||"").toString().trim(),
            anexo: (anexo||"").toString().trim()
          });
        });

        // crear layers por año y botones
        const añosEncontrados = Object.keys(porAno).sort();
        // si no hay años, abortar
        if (!añosEncontrados.length) {
          console.error("No se detectaron registros organizables por año en el CSV.");
          return;
        }

        // inicializar markers object para años detectados
        añosEncontrados.forEach(yr => {
          markers[yr] = L.layerGroup();
        });

        // por cada año y entrada, crear marker y popup
        añosEncontrados.forEach(yr => {
          const grupos = porAno[yr];
          Object.values(grupos).forEach((entry, idx) => {
            // construir contenido cuadro1 (main)
            const municipio = entry.municipio || "Desconocido";
            const vereda = entry.vereda || "";
            // Fuentes como links que llaman a showFuente
            const fuentesHtml = entry.fuentes.map((f, i) => {
              const titulo = (f.fuente || "").toString();
              // pasar objeto fuente como JSON seguro en el onclick (escapando comillas)
              const json = JSON.stringify(f).replace(/'/g, "\\'").replace(/"/g, '&quot;');
              return `<a href="#" onclick="showFuente(${entry.lat}, ${entry.lon}, '${json}'); return false;" style="color:#00BFFF; display:block; margin-top:4px; text-decoration:underline;">${titulo}</a>`;
            }).join("");

            const popupMain = `
              <div class="popup-main" style="font-family: 'Arial Narrow', sans-serif; font-size:13px; color:#000;">
                <div><b>Municipio:</b> ${municipio}</div>
                <div style="margin-top:6px;"><b>Vereda:</b> ${vereda}</div>
                <div style="margin-top:6px;"><b>Fuente:</b><br>${fuentesHtml}</div>
              </div>
            `;

            // elegir icono por año si existe
            const icono = iconosPersonalizados[yr] || iconosPersonalizados[Object.keys(iconosPersonalizados)[0]];

            const marker = L.marker([entry.lat, entry.lon], { pane: "marcadores", icon: icono })
              .bindPopup(popupMain, { maxWidth: 350 });

            // añadir marker al layer del año
            markers[yr].addLayer(marker);
          });
        });

        // Crear botones dinámicos para años detectados (solo si no existen ya)
        // Insertarlos antes del final del contenedor #botones-anio
        const contBotones = document.getElementById("botones-anio");
        añosEncontrados.forEach(yr => {
          // si ya existe un botón con texto igual, no lo duplicamos
          const exists = Array.from(contBotones.children).some(ch => ch.textContent.trim() === String(yr));
          if (!exists) {
            const btn = document.createElement("div");
            btn.className = "boton-anio";
            btn.textContent = yr;
            btn.onclick = () => mostrarCapa(yr);
            contBotones.appendChild(btn);
          }
        });

        // Añadir al mapa la primera capa (año inicial)
        const añoInicial = añosEncontrados[0];
        if (markers[añoInicial]) {
          map.addLayer(markers[añoInicial]);
        }
      },
      error: err => {
        console.error("Error al cargar CSV:", err);
      }
    });

    // showFuente abre el detalle (Cuadro 2) con Arial Narrow
    function showFuente(lat, lon, json) {
      // json llega como string con &quot; si corresponde; revertir &quot; a " y parsear
      const clean = json.replace(/&quot;/g, '"').replace(/\\'/g, "'");
      let f;
      try { f = JSON.parse(clean); } catch(e) {
        // fallback: intentar parsear sustituyendo comillas
        try { f = eval("(" + clean + ")"); } catch(e2) { console.error("No se pudo parsear detalle:", e2); f = {}; }
      }
      const content = `
        <div class="popup-detalle" style="font-family: 'Arial Narrow', sans-serif; font-size:13px; color:#000;">
          <div style="font-weight:bold; text-transform:uppercase; margin-bottom:6px;">${f.fuente || ''}</div>
          <div><b>No. AUTORIZACION:</b><br>${f.no_aut || ''}</div>
          <div style="margin-top:6px;"><b>FECHA AUTORIZACION:</b><br>${f.fecha || ''}</div>
          <div style="margin-top:6px;"><b>Anexo:</b><br>${f.anexo ? `<a href="${f.anexo}" target="_blank">VER</a>` : ''}</div>
          <div style="margin-top:6px;"><b>Autorización sanitaria:</b><br>${f.anexo ? `<a href="${f.anexo}" target="_blank">VER</a>` : ''}</div>
        </div>
      `;
      L.popup({ maxWidth: 400 }).setLatLng([lat, lon]).setContent(content).openOn(map);
    }

    // mostrarCapa: quita todas las layers y muestra la pedida
    function mostrarCapa(year) {
      // remover todas las capas de años conocidos
      Object.keys(markers).forEach(y => {
        try { if (map.hasLayer(markers[y])) map.removeLayer(markers[y]); } catch(e){}
      });
      if (markers[year]) {
        map.addLayer(markers[year]);
      } else {
        console.warn("No hay datos para el año", year);
      }
    }

  </script>
</body>
</html>
