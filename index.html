<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Visor Autorizaciones Sanitarias - IDSN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    body {
      margin: 0;
      font-family: 'Arial Narrow', sans-serif;
      background-color: black;
      color: white;
    }
    #map {
      height: 100vh;
    }
    .custom-popup {
      background: rgba(50, 50, 50, 0.8);
      padding: 10px;
      border-radius: 10px;
      color: white;
    }
    .leaflet-control-layers {
      background-color: rgba(0,0,0,0.7);
      color: white;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    const map = L.map('map').setView([1.2, -77.3], 8);

    // Capa base satelital estilo Google Earth
    const googleSat = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: 'Imágenes © Google Earth',
    }).addTo(map);

    // Escala
    L.control.scale({ position: 'bottomright', imperial: false }).addTo(map);

    // Carga los datos de CSV
    function cargarCSV(url, grupoCapa) {
      Papa.parse(url, {
        download: true,
        header: true,
        complete: function(results) {
          const datos = results.data;

          // Agrupar por municipio
          const agrupado = {};
          datos.forEach(d => {
            const muni = d.Municipio;
            if (!agrupado[muni]) {
              agrupado[muni] = {
                veredas: new Set(),
                fuentes: new Set(),
                lat: d.Latitud,
                lon: d.Longitud
              };
            }
            agrupado[muni].veredas.add(d.Vereda || d.Corregimiento);
            agrupado[muni].fuentes.add(d.Fuente);
          });

          for (const muni in agrupado) {
            const v = agrupado[muni];
            const popup = `
              <div class="custom-popup">
                <b>Municipio:</b> ${muni}<br/>
                <b>Veredas/Corregimientos:</b> ${Array.from(v.veredas).join(', ')}<br/>
                <b>Fuentes:</b><ul>${Array.from(v.fuentes).map(f => `<li>${f}</li>`).join('')}</ul>
              </div>
            `;
            const marcador = L.marker([v.lat, v.lon]).bindPopup(popup);
            grupoCapa.addLayer(marcador);
          }
        }
      });
    }

    // Crear capas para cada año
    const capa2023 = L.layerGroup();
    const capa2024 = L.layerGroup();

    // URLs CSV
    const url2023 = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEIfxPwnfsK29s70MMP_eimRMxEIeTyWye0GIsUAslrRrWalcULyXwWlSiyZenbJ_r4-ww-vBHBnun/pub?gid=0&single=true&output=csv";
    const url2024 = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR9MXHFzd2BkQkYDlCp3TS0vLQr6JCzV-prDxyNErrCiXHAnHnKjH95Z1es_jhYbRwnI2C5mZgW0Ccr/pub?gid=0&single=true&output=csv";

    cargarCSV(url2023, capa2023);
    cargarCSV(url2024, capa2024);

    // Control de capas
    const overlays = {
      "Autorizaciones Sanitarias 2023": capa2023,
      "Autorizaciones Sanitarias 2024": capa2024
    };
    L.control.layers(null, overlays, { collapsed: false }).addTo(map);

    // Norte (imagen personalizada)
    const northIcon = L.control({ position: 'topright' });
    northIcon.onAdd = function () {
      const img = L.DomUtil.create('img');
      img.src = 'image.png'; // Asegúrate que el archivo esté en el mismo directorio
      img.style.width = '70px';
      return img;
    };
    northIcon.addTo(map);
  </script>
</body>
</html>
