<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa de Autorizaciones Sanitarias de Agua en Nariño</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    #map {
      height: 90vh;
      width: 100%;
    }
    body {
      margin: 0;
      font-family: 'Arial Narrow', sans-serif;
    }
    h1 {
      text-align: center;
      background-color: #0074D9;
      color: white;
      padding: 10px;
    }
    #botones-anio {
      text-align: center;
      margin: 10px;
    }
    .boton-anio {
      display: inline-block;
      margin: 0 10px;
      padding: 10px 20px;
      background-color: #00BFFF;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }
    .boton-anio:hover {
      background-color: #009ACD;
    }
  </style>
</head>
<body>
  <h1>MAPA DE AUTORIZACIONES SANITARIAS DE AGUA EN NARIÑO</h1>
  <div id="map"></div>
  <div id="botones-anio">
    <div class="boton-anio" onclick="mostrarCapa(2023)">2023</div>
    <div class="boton-anio" onclick="mostrarCapa(2024)">2024</div>
    <div class="boton-anio" onclick="mostrarCapa(2025)">2025</div>
  </div>

<script>
const map = L.map("map").setView([1.289, -77.29], 8);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a>'
}).addTo(map);

const markers = {
  2023: L.layerGroup().addTo(map),
  2024: L.layerGroup(),
  2025: L.layerGroup()
};

const icono2023 = L.icon({
  iconUrl: 'MARCADOR1.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [0, -41]
});
const icono2024 = L.icon({
  iconUrl: 'MARCADOR2.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [0, -41]
});
const icono2025 = L.icon({
  iconUrl: 'MARCADOR3.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [0, -41]
});

const data2023 = 'URL_DEL_CSV_2023';
const data2024 = 'URL_DEL_CSV_2024';
const data2025 = 'URL_DEL_CSV_2025';

function cargarCsv(year, url) {
  Papa.parse(url, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: results => {
      const puntos = {};
      window.popupData = [];
      results.data.forEach(row => {
        const vereda = row["CORREGIMIENTO O VEREDA"]?.trim();
        const lat = parseFloat((row["LATITUD DECIMAL"] || "").replace(",", "."));
        const lon = parseFloat((row["LONGITUD DECIMAL"] || "").replace(",", "."));
        if (!vereda || isNaN(lat) || isNaN(lon)) return;
        const key = vereda;
        if (!puntos[key]) puntos[key] = {
          municipio: row["MUNICIPIO"]?.trim(),
          vereda, lat, lon, fuentes: []
        };
        puntos[key].fuentes.push({
          fuente: row["FUENTE"]?.trim(),
          no_aut: row["NO. AUTORIZACION"]?.trim(),
          fecha: row["FECHA AUTORIZACION"]?.trim(),
          anexo: row["ANEXO"]?.trim()
        });
      });

      Object.values(puntos).forEach((entry, index) => {
        window.popupData[index] = entry;
        const popupMain = `
          <div id="popup-main-${index}" style="font-family:'Arial Narrow';font-size:13px;">
            <div><b>MUNICIPIO:</b><br>${entry.municipio}</div>
            <div style="margin-top:6px;"><b>CORREGIMIENTO O VEREDA:</b><br>${entry.vereda}</div>
            <div style="margin-top:6px;"><b>FUENTES:</b><br>
              ${entry.fuentes.map((f,i)=>`<a href="#" onclick="showDetalle(${index},${i});return false;" style="color:#00BFFF;display:block;margin-top:2px;">${f.fuente}</a>`).join("")}
            </div>
          </div>
          <div id="popup-detalle-${index}" style="display:none;font-family:'Arial Narrow';font-size:13px;"></div>
        `;
        const icono = year===2023 ? icono2023 : year===2024 ? icono2024 : icono2025;
        const marker = L.marker([entry.lat, entry.lon], {icon: icono}).bindPopup(popupMain);
        markers[year].addLayer(marker);
      });
    },
    error: err => console.error("Error al cargar CSV", err)
  });
}

function showDetalle(index, i) {
  const data = window.popupData[index].fuentes[i];
  const main = document.getElementById(`popup-main-${index}`);
  const det = document.getElementById(`popup-detalle-${index}`);
  if (main && det) {
    main.style.display = "none";
    det.style.display = "block";
    det.innerHTML = `
      <div style="font-weight:bold;text-transform:uppercase;margin-bottom:6px;">${data.fuente}</div>
      <div><b>No. AUTORIZACION:</b><br>${data.no_aut}</div>
      <div style="margin-top:6px;"><b>FECHA AUTORIZACION:</b><br>${data.fecha}</div>
      <div style="margin-top:6px;"><b>ANEXO:</b><br><a href="${data.anexo}" target="_blank" style="color:#00BFFF;">VER</a></div>
      <div style="margin-top:10px;"><a href="#" onclick="volverCuadro1(${index});return false;" style="color:#00BFFF;">⬅ Volver</a></div>
    `;
  }
}

function volverCuadro1(i) {
  const main = document.getElementById(`popup-main-${i}`);
  const det = document.getElementById(`popup-detalle-${i}`);
  if (main && det) {
    main.style.display = "block";
    det.style.display = "none";
  }
}

function mostrarCapa(year) {
  [2023, 2024, 2025].forEach(y => map.removeLayer(markers[y]));
  map.addLayer(markers[year]);
}

// Cargar datos CSV
cargarCsv(2023, data2023);
cargarCsv(2024, data2024);
cargarCsv(2025, data2025);
</script>
</body>
</html>
